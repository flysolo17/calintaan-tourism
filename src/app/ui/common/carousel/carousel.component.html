<div class="carousel-container">
  <div class="carousel-wrapper" [@slideAnimation]="animationDirection">
    <ng-container *ngFor="let item of items; let i = index">
      <div class="carousel-slide" *ngIf="i === currentIndex">
        <img [src]="item" alt="Carousel Image" />
      </div>
    </ng-container>
  </div>

  <!-- Controls -->
  <button mat-icon-button class="nav-btn left" (click)="prevSlide()">
    <mat-icon>chevron_left</mat-icon>
  </button>
  <button mat-icon-button class="nav-btn right" (click)="nextSlide()">
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>
